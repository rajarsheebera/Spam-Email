
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Spam Detection</title>

    <style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap');

* {
    box-sizing: border-box;
}

:root {
    --paper: #fdf6e3;
    --card: #fffdf5;
    --ink: #2b2b2b;
    --peach: #ffb88c;
    --butter: #ffe29a;
    --mint: #b8e0d2;
}

body {
    margin: 0;
    font-family: "Space Mono", monospace;
    background-color: var(--paper);
    background-image: radial-gradient(#d9cfae 1px, transparent 1px);
    background-size: 18px 18px;
    color: var(--ink);
}

.header {
    background: var(--butter);
    color: var(--ink);
    padding: 24px 16px;
    text-align: center;
    border-bottom: 4px solid var(--ink);
}

.header h1 {
    margin: 0;
    font-family: "Press Start 2P", monospace;
    font-size: 18px;
    line-height: 1.6;
}

.work-area {
    max-width: 600px;
    margin: 40px auto;
    padding: 28px;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 6px;
    box-shadow: 8px 8px 0 var(--ink);
}

label {
    display: block;
    margin-bottom: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 14px;
}

textarea {
    width: 100%;
    height: 160px;
    padding: 12px;
    background: #fff;
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 4px;
    font-family: "Space Mono", monospace;
    font-size: 15px;
    resize: vertical;
}

textarea:focus {
    outline: none;
    background: #fffbe8;
    box-shadow: 4px 4px 0 var(--mint);
}

button {
    margin-top: 16px;
    padding: 12px 22px;
    background: var(--peach);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 4px;
    font-family: "Space Mono", monospace;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
}

button:hover {
    background: #ffc9a3;
}

button:active {
    transform: translate(4px, 4px);
    box-shadow: 0 0 0 var(--ink);
}

#result {
    margin-top: 24px;
    padding: 14px;
    background: #fff;
    border: 3px dashed var(--ink);
    border-radius: 4px;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
}

#result:empty {
    display: none;
}
    </style>
</head>

<body>

    <header>
        <div class="header">
            <h1>Check Whether Your Message Is Spam</h1>
        </div>
    </header>

    <main>
        <div class="work-area">

            <form id="spam-form">

                <label for="email-message">
                    Enter your email or message:
                </label>

                <textarea
                    id="email-message"
                    name="message"
                    placeholder="Paste your message here..."
                    required
                ></textarea>

                <button type="submit">
                    Check Spam
                </button>

            </form>

            <div id="result" role="status" aria-live="polite"></div>

        </div>
    </main>

    <script>
        const form = document.getElementById("spam-form");
        const messageInput = document.getElementById("email-message");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const message = messageInput.value.trim();

            if (!message) {
                result.textContent = "Please enter a message.";
                return;
            }

            result.textContent = "Checking message...";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Prediction failed."
                    );
                }

                if (data.prediction === "spam") {
                    result.textContent = "⚠️ This message may be SPAM!";
                    result.style.color = "red";
                } else if (data.prediction === "ham") {
                    result.textContent = "✅ This message is classified as NOT SPAM.";
                    result.style.color = "green";
                } else {
                    result.textContent = "Unexpected prediction from the server.";
                    result.style.color = "orange";
                }

            } catch (error) {
                result.textContent =
                    "Could not connect to the ML backend. Check that FastAPI is running.";
                result.style.color = "red";

                console.error(error);
            }
        });
    </script>

</body>

</html>
